<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Portfolio Data Initialization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #050505;
        color: #ededed;
        margin: 0;
        padding: 2rem;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 3rem;
        border-radius: 1.5rem;
      }
      h1, h2 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #38bdf8;
      }
      .form-group {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      input, textarea {
        background: #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: white;
        padding: 0.75rem;
        border-radius: 8px;
        font-family: inherit;
      }
      button {
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
        font-size: 1.1rem;
      }
      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Admin Initialization Panel</h1>
        <p>Set up or update your portfolio data.</p>
      </header>

      <section>
        <h2>Upload Media</h2>
        <form id="admin-form">
          <div class="form-group">
            <label for="profileImage">Profile Image (Upload to Cloudinary)</label>
            <input type="file" id="profileImage" accept="image/*" />
          </div>

          <div class="form-group">
            <label for="resumePdf">Resume PDF (Upload to Cloudinary)</label>
            <input type="file" id="resumePdf" accept=".pdf" />
          </div>

          <h2>Textual Data</h2>
          
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" value="DARISI VASUNDHARA" required />
          </div>
          
          <div class="form-group">
            <label for="contact">Contact No</label>
            <input type="text" id="contact" value="+91-7729805155" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="darisivasundhara1@gmail.com" required />
          </div>

          <div class="form-group">
            <label for="objective">Career Objective</label>
            <textarea id="objective" rows="4" required>Motivated Computer Science student with hands-on experience in Python, Full Stack Web Development, and Database Systems. Looking to contribute to tech projects and enhance my software development skills.</textarea>
          </div>

          <button type="submit" id="submit-btn">Save to Cloudinary & Firebase</button>
          
          <p id="status-msg" style="margin-top: 1.5rem; text-align: center; font-weight: 500;"></p>
        </form>
      </section>
      
      <div style="text-align: center; margin-top: 2rem;">
        <a href="/" style="color: #a1a1aa; text-decoration: none;">&larr; Back to Portfolio</a>
      </div>
    </div>
    
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
